name: PNW release prep

# Production-deployment gate for the PNW distribution.
#
# Runs ONLY on the two channels that reach cars other than the developer's own:
#   3testpnw — friends channel
#   3pnw     — production/release channel
# The developer channel (3devpnw) is deliberately EXCLUDED: it is expected to be broken
# mid-iteration, and gating it would only slow the loop on a car whose driver is the person
# breaking it.
#
# What this gate is for: the device installs from git and BUILDS ON BOOT. So a branch that does
# not compile does not fail in CI — it fails in a parked truck that will not go onroad. These
# jobs answer "would this branch boot and drive?" before it reaches anyone else's vehicle.

on:
  push:
    branches:
      - 3testpnw
      - 3pnw
  workflow_dispatch:

concurrency:
  group: pnw-release-prep-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  # 1. CARS.md must match the car definitions it is generated from.
  # It is autogenerated and easy to forget; a stale table misrepresents supported hardware to
  # anyone installing from this branch (e.g. the F-150 Lightning coupler requirement).
  car_docs:
    name: 1. CARS.md is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Fetch LFS
        uses: nick-fields/retry@7152eba30c6575329ac0576536151aca5a72780e
        with:
          timeout_minutes: 5
          max_attempts: 3
          command: git lfs pull
      - run: ./tools/op.sh setup
      - name: Regenerate CARS.md
        run: python3 selfdrive/car/docs.py
      - name: Fail if CARS.md was out of date
        run: |
          if ! git diff --quiet docs/CARS.md; then
            echo "::error file=docs/CARS.md::CARS.md is stale — regenerate with 'python3 selfdrive/car/docs.py' and commit."
            git diff --stat docs/CARS.md
            git diff docs/CARS.md | head -100
            exit 1
          fi
          echo "CARS.md is current ($(grep -oE '# [0-9]+ Supported Cars' docs/CARS.md))"
      - name: Upload regenerated CARS.md
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: CARS.md-regenerated
          path: docs/CARS.md

  # 2. The branch must actually compile. This is the job that matters most: build-on-boot means a
  # compile error strands the car offroad rather than failing here.
  build:
    name: 2. Compiles (build-on-boot dry run)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Fetch LFS
        uses: nick-fields/retry@7152eba30c6575329ac0576536151aca5a72780e
        with:
          timeout_minutes: 5
          max_attempts: 3
          command: git lfs pull
      - run: ./tools/op.sh setup
      - name: Install system build deps
        # op.sh setup only installs what tools/setup_dependencies.sh lists (build-essential, curl,
        # git, xvfb, ...) — it does NOT install libusb-1.0-0-dev. selfdrive/pandad links against
        # system usb-1.0 (SConstruct whitelists it as a non-vendored lib) but nothing adds the
        # header to CPPPATH, so a bare runner fails with "libusb-1.0/libusb.h: No such file or
        # directory". Same fix already proven working in 3pnw-release.yaml's aarch64 compile check.
        run: |
          sudo apt-get update
          sudo apt-get install -y libusb-1.0-0-dev
      - name: Build (same entrypoint the device runs on boot)
        timeout-minutes: 40
        run: python3 system/manager/build.py

  # 3. Preflight checks that catch the failure modes this fork has actually hit on the car.
  preflight:
    name: 3. Deployment preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - run: ./tools/op.sh setup

      # Submodule pins must be pushed and reachable. A pin to an unpushed local commit clones
      # fine here but leaves the CAR unable to fetch opendbc/panda — the single most likely way
      # to brick an install from a channel branch.
      - name: Submodule pins are reachable on their remotes
        run: |
          # NB: the loop body must NOT be in a pipeline — a subshell `exit 1` would not fail the
          # step. Feed the list in via a process substitution and track failures in the parent.
          #
          # This was rewritten after the first version false-positived on every submodule except
          # panda. Two bugs in that version:
          #  - `git branch -r --contains` inspects the LOCAL clone's remote-tracking refs, but
          #    actions/checkout does a shallow, detached submodule checkout with no remote-tracking
          #    branches fetched — there is nothing for --contains to find even when the commit is
          #    correctly pushed.
          #  - it read the url straight out of .gitmodules, which is frequently a RELATIVE path
          #    (e.g. `../pnw-opendbc.git`, `../../commaai/rednose.git`) — not a fetchable url.
          #
          # Fix: actions/checkout already resolves each submodule's relative .gitmodules url into
          # an absolute one, written into that submodule's own `remote.origin.url` — read it from
          # there instead of hand-rolling the ../ path math. Then, instead of trusting anything in
          # the local clone (which — by construction — already HAS the pinned commit's object,
          # since that's what got checked out, so any local-object-existence test trivially passes
          # even for a commit that was never pushed), fetch the exact pinned sha into a brand-new,
          # completely empty bare repo. That only succeeds if the REMOTE will actually serve that
          # commit (GitHub — and most git hosts — refuse `fetch <sha>` for a sha that isn't
          # reachable from some ref on the remote: "not our ref"). This is exactly what the car
          # does on `git submodule update`, so it's the most direct test of the real failure mode.
          # Verified against both a real pushed pin (ok) and a real, valid, but deliberately
          # unpushed commit object (correctly rejected with "not our ref") before landing this.
          fail=0
          while read -r line; do
            sha=$(echo "$line" | awk '{print $1}' | tr -d '+-')
            path=$(echo "$line" | awk '{print $2}')
            [ -e "$path/.git" ] || continue
            url=$(git -C "$path" config --get remote.origin.url 2>/dev/null || echo "")
            if [ -z "$url" ]; then
              echo "::error::submodule '$path' has no resolvable remote.origin.url — cannot verify its pin"
              fail=1
              continue
            fi
            # ssh urls (git@host:owner/repo.git) need a deploy key the runner doesn't have —
            # these are all public repos, so fetch over anonymous https instead.
            url_https=$(echo "$url" | sed -E 's#^git@([^:]+):#https://\1/#')
            scratch=$(mktemp -d)
            git init -q --bare "$scratch"
            git -C "$scratch" remote add origin "$url_https"
            if git -C "$scratch" -c credential.helper= fetch -q origin "$sha" 2>/tmp/pin-fetch-err; then
              echo "ok: $path @ ${sha:0:8} ($url_https)"
            else
              echo "::error::submodule '$path' is pinned to $sha which the remote ($url_https) will NOT serve — it was never pushed (or was force-removed). Push the companion repo BEFORE bumping the pin, or the car cannot fetch it."
              sed 's/^/    /' /tmp/pin-fetch-err
              fail=1
            fi
            rm -rf "$scratch" /tmp/pin-fetch-err
          done < <(git submodule status --recursive)
          exit $fail

      # Every param the UI reads must exist in params_keys.h. A missing key raises UnknownKeyName,
      # which crash-loops the UI and has previously looked exactly like a hardware/power fault.
      - name: Params referenced by the UI exist in params_keys.h
        run: |
          # The first version of this check only matched the literal receivers `params.` and
          # `Params().`, on the theory that a bare `.get("x")` also matches dicts/capnp
          # structs/state bags (~50 false positives when first written). That fix over-corrected:
          # the overwhelming majority of real Params() reads in selfdrive/ui/ go through
          # `self.params`, `self._params`, `ui_state.params`, `self.mem` or `self._mem` — none of
          # which matched — so the check was silently checking almost nothing. Rewritten to
          # discover the actual Params()-typed attribute names from their `X = Params(...)`
          # assignments, then only accept `.get/.put(...)` calls whose receiver's last dotted
          # segment is one of those (or a bare `Params()`), which keeps the false-positive fix
          # while covering the real call sites. This immediately caught a genuine bug: FordLatStatus
          # (opendbc_repo/opendbc/car/ford/carcontroller.py -> selfdrive/ui/onroad/ces_status.py)
          # was never registered, so that mem-param always raised UnknownKeyName (swallowed by a
          # broad except, so it didn't crash-loop — it just silently made the Ford-lateral-status
          # UI feature permanently dead) — fixed alongside this check in the same commit.
          python3 - <<'PY'
          import re, sys, glob

          keys = set(re.findall(r'\{"([A-Za-z0-9_]+)"', open("common/params_keys.h").read()))

          files = glob.glob("selfdrive/ui/**/*.py", recursive=True)
          texts = {f: open(f, encoding="utf-8", errors="ignore").read() for f in files}

          attr_names = set()
          assign_re = re.compile(r'([A-Za-z_][A-Za-z0-9_]*)\s*=\s*Params\(')
          for text in texts.values():
              attr_names.update(m.group(1) for m in assign_re.finditer(text))

          call_re = re.compile(r'([A-Za-z_][A-Za-z0-9_.]*|Params\(\))\.(get_bool|get|put_bool|put)\(\s*["\']([A-Za-z0-9_]+)["\']')
          used = {}
          for f, text in texts.items():
              for lineno, line in enumerate(text.splitlines(), 1):
                  for receiver, _method, key in call_re.findall(line):
                      is_params = receiver == "Params()" or receiver.split(".")[-1] in attr_names
                      if is_params:
                          used.setdefault(key, (f, lineno))

          missing = sorted(k for k in used if k not in keys)
          for k in missing:
              f, lineno = used[k]
              print(f"::error file={f},line={lineno}::UI reads param '{k}' which is NOT registered in common/params_keys.h — this raises UnknownKeyName on the device.")

          if missing:
              sys.exit(1)
          print(f"all {len(used)} UI params registered ({len(attr_names)} Params()-typed receiver names: {sorted(attr_names)})")
          PY

      - name: Python syntax + lint on changed code
        run: |
          ruff check selfdrive/ system/ tools/ || true   # advisory: upstream is not ruff-clean
          python3 -m compileall -q selfdrive system common || exit 1

      - name: Device-side helper scripts compile
        run: |
          for f in scripts/*.py; do
            [ -e "$f" ] || continue
            python3 -m py_compile "$f" || { echo "::error file=$f::does not compile"; exit 1; }
          done
          echo "device scripts OK"

  # 4. Summary gate — one required check for branch protection to point at.
  release_ready:
    name: 4. Release ready
    runs-on: ubuntu-latest
    needs: [car_docs, build, preflight]
    if: always()
    steps:
      - name: Verdict
        run: |
          if [ "${{ needs.car_docs.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.preflight.result }}" != "success" ]; then
            echo "::error::NOT release ready — car_docs=${{ needs.car_docs.result }} build=${{ needs.build.result }} preflight=${{ needs.preflight.result }}"
            exit 1
          fi
          echo "✅ ${{ github.ref_name }} is release ready"
